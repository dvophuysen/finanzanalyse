name: Build & Publish

on:
  push:
    branches: [main]
    paths:
      - "finanzanalyse/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

jobs:
  build:
    name: Build aarch64 (native)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          v=$(grep -E '^version:' finanzanalyse/config.yaml | head -1 | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: finanzanalyse
          file: finanzanalyse/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finanzanalyse-aarch64:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/finanzanalyse-aarch64:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base-debian:bookworm
          cache-from: type=gha
          cache-to: type=gha,mode=max
